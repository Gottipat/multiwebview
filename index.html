<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split-Screen Web Viewer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>MultiWeb <span>Viewer</span></h1>
            <div class="controls">
                <select id="theme-selector" class="theme-select" title="Change Theme">
                    <option value="theme-dark">🌌 Dark Mode (Default)</option>
                    <option value="theme-light">☀️ Light Mode</option>
                    <option value="theme-cyber">💻 Cyberpunk</option>
                    <option value="theme-minimal">📝 Minimalist</option>
                </select>
                <button id="add-screen-btn" class="btn primary-btn">+ Add Screen</button>
            </div>
        </header>

        <main id="grid-container" class="grid-container screens-1">
            <!-- Screens will be injected here -->
        </main>
    </div>

    <template id="screen-template">
        <div class="screen-panel">
            <div class="panel-header">
                <div class="nav-controls">
                    <button class="nav-btn back-btn" title="Go Back" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                    <button class="nav-btn forward-btn" title="Go Forward" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                    </button>
                    <button class="nav-btn refresh-btn" title="Refresh">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6M3 12a9 9 0 1 0 2.6-6.4L2 12M2 12h6"/></svg>
                    </button>
                </div>
                <div class="url-bar">
                    <input type="text" class="url-input" placeholder="example.com" />
                    <button class="go-btn" title="Load URL">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                </div>
                <button class="close-btn" title="Close screen">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="panel-content">
                <div class="placeholder-message">
                    <p>Enter a URL to load.</p>
                    <small>Note: Some websites block being loaded in a split screen (iframe).</small>
                </div>
                <!-- Iframe injected here -->
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
